name: Release

# When a version tag (v0.1.1, v0.2.0, ...) is pushed, tests the project and stages the package on npm.
# The version only goes live after the maintainer approves it (npm stage approve), which asks for the passkey.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing and `npm stage` need a recent npm 11.
      - run: npm install -g npm@11.21.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Check that the tag matches the package version
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match packages/cli/package.json version $version"
            exit 1
          fi
      - name: Stage on npm
        working-directory: packages/cli
        run: npm stage publish
      - name: Next step
        run: |
          {
            echo "### Version staged on npm"
            echo
            echo "The version is not public yet. Approve it from a terminal, with your passkey:"
            echo
            echo '```bash'
            echo "npx --yes npm@11.21.2 stage list svclens"
            echo "npx --yes npm@11.21.2 stage approve <stage-id>"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
